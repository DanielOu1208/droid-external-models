name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, platform: darwin-arm64, target: bun-darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64, target: bun-darwin-x64-baseline }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, target: bun-linux-arm64 }
          - { runner: ubuntu-latest, platform: linux-x64, target: bun-linux-x64-baseline }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun build --compile --target=${{ matrix.target }} src/cli.ts --outfile dist/droid-models
      # Bun's baseline Intel build keeps a signature that its own bundling step invalidates.
      - if: runner.os == 'macOS'
        run: codesign --force --sign - dist/droid-models && codesign --verify dist/droid-models
      - run: bun scripts/smoke.ts dist/droid-models
      - run: tar -czf droid-models-${{ matrix.platform }}.tar.gz -C dist droid-models
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: droid-models-${{ matrix.platform }}
          path: droid-models-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - run: cd release && sha256sum droid-models-*.tar.gz > checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    needs: release
    # npm only lets a workflow publish a package after its owner has published it once and trusted the workflow.
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - run: bun scripts/publish-npm.ts release
